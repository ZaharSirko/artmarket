version: '3.8'

services:
  # PostgreSQL для painting-service
  postgres-painting:
    image: postgres:latest
    container_name: postgres-painting
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: boomlog123321
      POSTGRES_DB: painting_db
    volumes:
      - ./postgres_data/painting:/var/lib/postgresql/data
      - ./docker/pgsql/painting_init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    networks:
      - artmarket_network


  # PostgreSQL для user-service
  postgres-keycloak:
    image: postgres:latest
    container_name: postgres-keycloak
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: boomlog123321
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5434:5432"
    volumes:
      - ./postgres_data/keycloak:/var/lib/postgresql/data
      - ./docker/pgsql/keycloak_init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - artmarket_network


  # PostgreSQL для order-service
  postgres-order:
    image: postgres:latest
    container_name: postgres-order
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: boomlog123321
      POSTGRES_DB: order_db
    volumes:
      - ./postgres_data/order:/var/lib/postgresql/data
      - ./docker/pgsql/order_init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5435:5432"
    networks:
      - artmarket_network

  # Elasticsearch для пошуку картин
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - artmarket_network

  # Опціонально: Kibana для візуалізації Elasticsearch (якщо потрібно)
#  kibana:
#    image: docker.elastic.co/kibana/kibana:8.12.0
#    container_name: kibana
#    depends_on:
#      - elasticsearch
#    ports:
#      - "5601:5601"
#    environment:
#      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
#    networks:
#      - artmarket_network

  # keycloak для user-service
  keycloak:
   container_name: keycloak
   image: quay.io/keycloak/keycloak:24.0.1
   command: [ "start-dev", "--import-realm" ]
   environment:
    KC_HOSTNAME: localhost
    KC_HOSTNAME_PORT: 8181
    KC_HOSTNAME_STRICT_BACKCHANNEL: false
    KC_HTTP_ENABLED: true
    KC_HOSTNAME_STRICT_HTTPS: false
    KC_HEALTH_ENABLED: true
    KEYCLOAK_ADMIN: admin
    KEYCLOAK_ADMIN_PASSWORD: admin
    KC_DB: postgres
    KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak_db
    KC_DB_USERNAME: postgres
    KC_DB_PASSWORD: boomlog123321
   ports:
    - "8181:8080"
   volumes:
     - ./docker/keycloak/realms/:/opt/keycloak/data/import/
   depends_on:
    - postgres-keycloak
   networks:
     - artmarket_network

  # Логи
#  prometheus:
#    image: prom/prometheus
#    container_name: prometheus
#    volumes:
#      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
#    ports:
#      - "9090:9090"
#    networks:
#      - artmarket_network
#
#  # Візуалізація логів
#  grafana:
#    image: grafana/grafana
#    container_name: grafana
#    ports:
#      - "3000:3000"
#    volumes:
#      - grafana_data:/var/lib/grafana
#    networks:
#      - artmarket_network


  # Додано Kafka та Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - artmarket_network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - artmarket_network

  # Додано Kafdrop для візуалізації Kafka
  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: kafdrop
    depends_on:
      - kafka
    ports:
      - "9100:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
      JVM_OPTS: "-Xms32M -Xmx64M"
      SERVER_SERVLET_CONTEXT_PATH: "/"
    networks:
      - artmarket_network


# Мережа для зв'язку між сервісами
networks:
  artmarket_network:
    driver: bridge

# Томи для збереження даних
volumes:
  postgres_data:
  elasticsearch_data:
  grafana_data: